<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Heimdalsløpet – Agentregistrering</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green-dark: #0b3d2e;
      --green-mid: #14663e;
      --green-light: #1a8a52;
      --accent-yellow: #fbbf24;
      --accent-red: #ef4444;
      --bg: #f0fdf4;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding: 1rem;
      color: #1a1a1a;
    }

    header {
      background: var(--green-dark);
      color: #fff;
      text-align: center;
      padding: 1rem 1.5rem;
      border-radius: 14px;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    header p {
      font-size: .8rem;
      opacity: .75;
    }

    .counter {
      background: var(--accent-yellow);
      color: #78350f;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 999px;
      padding: .4rem .9rem;
      white-space: nowrap;
    }

    .form-card {
      background: #fff;
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: 600;
      font-size: .95rem;
      margin-bottom: .4rem;
      color: #333;
    }

    input, select {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      margin-bottom: 1.1rem;
      font-family: inherit;
      background: #fafafa;
      -webkit-appearance: none;
      appearance: none;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--green-light);
      background: #fff;
    }

    .btn-register {
      display: block;
      width: 100%;
      padding: 1.1rem;
      background: var(--green-mid);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(20,102,62,0.3);
      transition: transform .15s, box-shadow .15s;
      margin-top: .25rem;
    }

    .btn-register:active {
      transform: scale(0.98);
    }

    .btn-register:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* Success state */
    .success-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2.5rem 1.5rem;
      gap: .75rem;
    }

    .success-overlay .checkmark {
      font-size: 4rem;
      animation: pop .3s ease-out;
    }

    .success-overlay h2 {
      font-size: 1.5rem;
      color: var(--green-mid);
    }

    .success-overlay p {
      color: #666;
      font-size: 1rem;
    }

    .success-overlay .next-hint {
      font-size: .9rem;
      color: #999;
      margin-top: .25rem;
    }

    @keyframes pop {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    .distanse-btns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: .6rem;
      margin-bottom: 1.1rem;
    }

    .dist-btn {
      padding: .85rem .5rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background: #fafafa;
      font-size: .95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
      text-align: center;
      color: #555;
    }

    .dist-btn.selected {
      border-color: var(--green-mid);
      background: var(--green-mid);
      color: #fff;
    }

    .dist-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>🏃 Agentregistrering</h1>
      <p>Heimdalsløpet 20. mai 2026</p>
    </div>
    <div>
      <div class="counter">✅ <span id="count">0</span></div>
    </div>
  </header>

  <div class="form-card">

    <!-- SKJEMA -->
    <div id="formFields">
      <label for="fornavn">Fornavn</label>
      <input type="text" id="fornavn" placeholder="Fornavn" autocomplete="given-name" inputmode="text">

      <label for="etternavn">Etternavn</label>
      <input type="text" id="etternavn" placeholder="Etternavn" autocomplete="family-name" inputmode="text">

      <label for="alder">Alder</label>
      <input type="number" id="alder" placeholder="Alder" min="1" max="120" inputmode="numeric">

      <label>Distanse</label>
      <div class="distanse-btns">
        <button type="button" class="dist-btn" data-val="Barneløype" onclick="velgDist(this)">🧒 Barn<br><small>17:30</small></button>
        <button type="button" class="dist-btn" data-val="3 km" onclick="velgDist(this)">🔵 3 km<br><small>17:45</small></button>
        <button type="button" class="dist-btn" data-val="5 km" onclick="velgDist(this)">🟠 5 km<br><small>18:15</small></button>
      </div>

      <button type="button" class="btn-register" id="btnReg" onclick="registrer()">Registrer løper</button>
    </div>

    <!-- BEKREFTELSE -->
    <div class="success-overlay" id="successOverlay">
      <div class="checkmark">✅</div>
      <h2 id="successName"></h2>
      <p id="successDist"></p>
      <p class="next-hint">Klar for neste om <span id="countdown">2</span> sek...</p>
    </div>

  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyB_lq7eIQJzJtVrREmNPAJEUf1nAukpih3JrPgjZ4rGTcZ4WBd31Ud8pJ5b78AuE9X/exec';
    let valgtDist = '';
    let registrertCount = 0;

    function velgDist(btn) {
      document.querySelectorAll('.dist-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      valgtDist = btn.dataset.val;
    }

    async function registrer() {
      const fornavn  = document.getElementById('fornavn').value.trim();
      const etternavn = document.getElementById('etternavn').value.trim();
      const alder    = document.getElementById('alder').value.trim();

      if (!fornavn || !etternavn || !alder || !valgtDist) {
        alert('Fyll ut alle felt og velg distanse.');
        return;
      }

      const btn = document.getElementById('btnReg');
      btn.disabled = true;
      btn.textContent = 'Sender…';

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fornavn, etternavn, alder,
            distanse: valgtDist,
            epost: '(stedsregistrering)'
          })
        });

        // ntfy varsling
        fetch('https://ntfy.sh/heimdalslopet-pamelding', {
          method: 'POST',
          body: fornavn + ' ' + etternavn + ' registrert pa ' + valgtDist + ' (agent)',
          headers: {
            'Title': 'Stedsregistrering - Heimdalslopet',
            'Priority': 'default',
            'Tags': 'running'
          }
        }).catch(() => {});

        // Vis bekreftelse
        registrertCount++;
        document.getElementById('count').textContent = registrertCount;
        document.getElementById('successName').textContent = fornavn + ' ' + etternavn;
        document.getElementById('successDist').textContent = valgtDist;
        document.getElementById('formFields').style.display = 'none';
        const overlay = document.getElementById('successOverlay');
        overlay.style.display = 'flex';

        // Tell ned og reset
        let sek = 2;
        document.getElementById('countdown').textContent = sek;
        const timer = setInterval(() => {
          sek--;
          document.getElementById('countdown').textContent = sek;
          if (sek <= 0) {
            clearInterval(timer);
            resetSkjema();
          }
        }, 1000);

      } catch(e) {
        alert('Noe gikk galt. Prøv igjen.');
        btn.disabled = false;
        btn.textContent = 'Registrer løper';
      }
    }

    function resetSkjema() {
      document.getElementById('fornavn').value = '';
      document.getElementById('etternavn').value = '';
      document.getElementById('alder').value = '';
      valgtDist = '';
      document.querySelectorAll('.dist-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('btnReg').disabled = false;
      document.getElementById('btnReg').textContent = 'Registrer løper';
      document.getElementById('successOverlay').style.display = 'none';
      document.getElementById('formFields').style.display = 'block';
      document.getElementById('fornavn').focus();
    }
  </script>

</body>
</html>
